<rect x="0" y="300" width="820" height="62" rx="0" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><text x="410" y="340" text-anchor="middle" font-size="22" font-weight="800" fill="#0f1b3d">Ask every course the same questions</text>
</g></g>
<text x="60" y="520" font-size="58" class="f" fill="#fff">Digital marketing courses,</text><text x="60" y="582" font-size="58" class="f" fill="#ffd43b">compared honestly.</text>
