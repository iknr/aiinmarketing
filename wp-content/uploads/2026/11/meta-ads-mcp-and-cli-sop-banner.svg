"#fff">Let AI read.</text><text x="60" y="504" font-size="58" class="f" fill="#ffd43b">You approve.</text><text x="60" y="560" font-size="22" font-weight="700" fill="#c9d4f2">A safe SOP for Meta Ads MCP and the CLI</text></svg>
