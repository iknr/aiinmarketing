<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated banner: an AI answer card appears in search results while a click fades away">
<title>Animated banner: an AI answer card appears in search results while a click fades away</title>
<style>
text{font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;}
.f{font-weight:800}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-18deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes slide{0%,20%{transform:translateX(0)}45%,100%{transform:translateX(34px)}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.9)}12%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(90px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes climb{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-12px)}}
@keyframes click{0%,55%{transform:translate(0,0) scale(1)}65%{transform:translate(-6px,-6px) scale(.85)}75%,100%{transform:translate(0,0) scale(1)}}
@keyframes fadeout{0%,50%{opacity:1}70%,100%{opacity:.15}}
@keyframes type{from{width:0}to{width:310px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b3d"/><stop offset="1" stop-color="#14286b"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="1060" cy="70" r="230" fill="#0b4fd6" opacity=".35"/><circle cx="90" cy="590" r="170" fill="#ffd43b" opacity=".13"/>
<g transform="translate(48 44)"><rect width="92" height="46" rx="12" fill="#ffd43b" stroke="#fff" stroke-width="3"/><text x="46" y="34" text-anchor="middle" class="f" font-size="30" fill="#0f1b3d">AIM</text></g>
<text x="154" y="62" font-size="15" font-weight="700" fill="#c9d4f2" letter-spacing="1.2">AI IN MARKETING</text>
<text x="154" y="84" font-size="14" font-weight="700" fill="#ffd43b">by Adsmentor</text>

<path d="M160 191 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:160px 200px;animation:twinkle 2.5s ease-in-out infinite;animation-delay:0s"/><path d="M420 131 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:420px 140px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.6s"/><path d="M1120 191 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1120px 200px;animation:twinkle 2.2s ease-in-out infinite;animation-delay:1.1s"/><path d="M1150 491 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1150px 500px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.3s"/>
<g transform="translate(150 150)"><rect width="900" height="82" rx="41" fill="#fff" stroke="#0f1b3d" stroke-width="4"/><circle cx="52" cy="41" r="16" fill="none" stroke="#0b4fd6" stroke-width="5"/><line x1="63" y1="52" x2="76" y2="65" stroke="#0b4fd6" stroke-width="5" stroke-linecap="round"/>
<clipPath id="tc"><rect x="100" y="14" width="760" height="54"/></clipPath><g clip-path="url(#tc)"><text x="100" y="53" font-size="28" font-weight="700" fill="#0f1b3d">best way to learn AI marketing?</text></g></g>
<g transform="translate(150 270)"><g style="animation:pop 7s ease-in-out infinite"><rect width="640" height="200" rx="22" fill="#0b4fd6" stroke="#fff" stroke-width="4"/><circle cx="52" cy="50" r="18" fill="#ffd43b"/><text x="84" y="58" font-size="22" font-weight="800" fill="#fff">AI answer</text>
<rect x="34" y="88" width="560" height="14" rx="7" fill="#fff" opacity=".85"/><rect x="34" y="114" width="480" height="14" rx="7" fill="#fff" opacity=".6"/><rect x="34" y="140" width="520" height="14" rx="7" fill="#fff" opacity=".4"/>
<rect x="34" y="166" width="170" height="26" rx="13" fill="#ffd43b"/><text x="119" y="185" text-anchor="middle" font-size="15" font-weight="800" fill="#0f1b3d">AIM mentioned</text></g></g>
<g style="animation:fadeout 4s ease-in-out infinite"><g transform="translate(860 330)"><path d="M0 0l0 90 24-22 20 46 18-9-20-45 32-2z" fill="#fff" stroke="#0f1b3d" stroke-width="4" stroke-linejoin="round" style="animation:click 4s ease-in-out infinite"/></g><text x="880" y="480" font-size="26" class="f" fill="#ffd43b">0 clicks</text></g>
<g style="animation:bob2 3s ease-in-out infinite"><rect x="800" y="500" width="320" height="56" rx="28" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="960" y="536" text-anchor="middle" font-size="22" class="f" fill="#0f1b3d">Still found. Still chosen.</text></g>
<text x="60" y="520" font-size="58" class="f" fill="#fff">Fewer clicks.</text><text x="60" y="582" font-size="58" class="f" fill="#ffd43b">Same customers.</text>
</svg>
