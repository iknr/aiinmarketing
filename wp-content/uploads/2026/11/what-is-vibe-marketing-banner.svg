<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated banner: Spark the robot chats about building a landing page for vibe marketing">
<title>Animated banner: Spark the robot chats about building a landing page for vibe marketing</title>
<style>
text{font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;}
.f{font-weight:800}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-18deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes slide{0%,20%{transform:translateX(0)}45%,100%{transform:translateX(34px)}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.9)}12%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(90px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes climb{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-12px)}}
@keyframes click{0%,55%{transform:translate(0,0) scale(1)}65%{transform:translate(-6px,-6px) scale(.85)}75%,100%{transform:translate(0,0) scale(1)}}
@keyframes fadeout{0%,50%{opacity:1}70%,100%{opacity:.15}}
@keyframes type{from{width:0}to{width:310px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b3d"/><stop offset="1" stop-color="#14286b"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="1060" cy="70" r="230" fill="#0b4fd6" opacity=".35"/><circle cx="90" cy="590" r="170" fill="#ffd43b" opacity=".13"/>
<g transform="translate(48 44)"><rect width="92" height="46" rx="12" fill="#ffd43b" stroke="#fff" stroke-width="3"/><text x="46" y="34" text-anchor="middle" class="f" font-size="30" fill="#0f1b3d">AIM</text></g>
<text x="154" y="62" font-size="15" font-weight="700" fill="#c9d4f2" letter-spacing="1.2">AI IN MARKETING</text>
<text x="154" y="84" font-size="14" font-weight="700" fill="#ffd43b">by Adsmentor</text>

<path d="M640 141 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:640px 150px;animation:twinkle 2.4s ease-in-out infinite;animation-delay:0s"/><path d="M980 101 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:980px 110px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.6s"/><path d="M1120 251 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1120px 260px;animation:twinkle 2.2s ease-in-out infinite;animation-delay:1.1s"/><path d="M560 291 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:560px 300px;animation:twinkle 2.8s ease-in-out infinite;animation-delay:0.3s"/><path d="M1100 471 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1100px 480px;animation:twinkle 3.4s ease-in-out infinite;animation-delay:0.9s"/>
<g transform="translate(120 150) scale(2.6)"><g style="transform-origin:60px 100px;animation:bob 3.2s ease-in-out infinite">
<line x1="60" y1="14" x2="60" y2="28" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="11" r="6" fill="#ffd43b" stroke="#fff" stroke-width="3" style="transform-origin:60px 11px;animation:pulse 1.6s ease-in-out infinite"/>
<rect x="22" y="28" width="76" height="60" rx="22" fill="#fff" stroke="#0f1b3d" stroke-width="4"/><rect x="31" y="40" width="58" height="34" rx="14" fill="#0f1b3d"/>
<g style="transform-origin:60px 57px;animation:blink 4.5s infinite"><circle cx="48" cy="57" r="6" fill="#ffd43b"/><circle cx="72" cy="57" r="6" fill="#ffd43b"/></g>
<path d="M52 82q8 6 16 0" fill="none" stroke="#0b4fd6" stroke-width="4" stroke-linecap="round"/>
<rect x="38" y="90" width="44" height="22" rx="10" fill="#0b4fd6" stroke="#0f1b3d" stroke-width="4"/><text x="60" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">AIM</text>
<g style="transform-origin:98px 66px;animation:wave 2.4s ease-in-out infinite"><path d="M98 66q16-2 14-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="112" cy="44" r="6" fill="#ffd43b" stroke="#fff" stroke-width="3"/></g>
<path d="M22 66q-12 4-12 18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g></g>
<g style="animation:bob 4s ease-in-out infinite;animation-delay:0s"><rect x="500" y="170" width="420" height="64" rx="18" fill="#0b4fd6" stroke="#fff" stroke-width="3"/><text x="522" y="209.0" font-size="21" font-weight="700" fill="#fff">Build me a landing page</text></g>
<g style="animation:bob 4s ease-in-out infinite;animation-delay:0.8s"><rect x="640" y="266" width="420" height="64" rx="18" fill="#fff" stroke="#fff" stroke-width="3"/><text x="662" y="305.0" font-size="21" font-weight="700" fill="#0f1b3d">Done. Want it bolder?</text></g>
<g transform="translate(660 360)"><rect width="110" height="46" rx="23" fill="#fff" stroke="#fff"/><circle cx="32" cy="23" r="6" fill="#0b4fd6" style="animation:dots 1.2s infinite"/><circle cx="55" cy="23" r="6" fill="#0b4fd6" style="animation:dots 1.2s infinite .15s"/><circle cx="78" cy="23" r="6" fill="#0b4fd6" style="animation:dots 1.2s infinite .3s"/></g>
<g style="animation:bob2 3.6s ease-in-out infinite;animation-delay:0s"><rect x="820" y="380" width="134.5" height="40" rx="20" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="887.25" y="407" text-anchor="middle" font-size="18" font-weight="800" fill="#0f1b3d">WordPress</text></g><g style="animation:bob2 3.6s ease-in-out infinite;animation-delay:0.5s"><rect x="560" y="430" width="97.0" height="40" rx="20" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><text x="608.5" y="457" text-anchor="middle" font-size="18" font-weight="800" fill="#0f1b3d">Claude</text></g><g style="animation:bob2 3.6s ease-in-out infinite;animation-delay:1s"><rect x="960" y="440" width="59.5" height="40" rx="20" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="989.75" y="467" text-anchor="middle" font-size="18" font-weight="800" fill="#0f1b3d">Ads</text></g><g style="animation:bob2 3.6s ease-in-out infinite;animation-delay:1.4s"><rect x="780" y="510" width="84.5" height="40" rx="20" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><text x="822.25" y="537" text-anchor="middle" font-size="18" font-weight="800" fill="#0f1b3d">Leads</text></g>
<text x="60" y="520" font-size="58" class="f" fill="#fff">A week of work.</text><text x="60" y="582" font-size="58" class="f" fill="#ffd43b">An afternoon.</text>
</svg>
