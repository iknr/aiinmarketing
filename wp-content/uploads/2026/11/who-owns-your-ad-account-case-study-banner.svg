<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated banner: a key leaves the founder for the freelancer while six months of ad data fades out">
<title>Animated banner: a key leaves the founder for the freelancer while six months of ad data fades out</title>
<style>
text{font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;}
.f{font-weight:800}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-18deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes slide{0%,20%{transform:translateX(0)}45%,100%{transform:translateX(34px)}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.9)}12%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(90px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes climb{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-12px)}}
@keyframes click{0%,55%{transform:translate(0,0) scale(1)}65%{transform:translate(-6px,-6px) scale(.85)}75%,100%{transform:translate(0,0) scale(1)}}
@keyframes fadeout{0%,50%{opacity:1}70%,100%{opacity:.15}}
@keyframes type{from{width:0}to{width:310px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b3d"/><stop offset="1" stop-color="#14286b"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="1060" cy="70" r="230" fill="#0b4fd6" opacity=".35"/><circle cx="90" cy="590" r="170" fill="#ffd43b" opacity=".13"/>
<g transform="translate(48 44)"><rect width="92" height="46" rx="12" fill="#ffd43b" stroke="#fff" stroke-width="3"/><text x="46" y="34" text-anchor="middle" class="f" font-size="30" fill="#0f1b3d">AIM</text></g>
<text x="154" y="62" font-size="15" font-weight="700" fill="#c9d4f2" letter-spacing="1.2">AI IN MARKETING</text>
<text x="154" y="84" font-size="14" font-weight="700" fill="#ffd43b">by Adsmentor</text>

<path d="M170 181 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:170px 190px;animation:twinkle 2.5s ease-in-out infinite;animation-delay:0s"/><path d="M470 111 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:470px 120px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.6s"/><path d="M1130 141 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1130px 150px;animation:twinkle 2.3s ease-in-out infinite;animation-delay:1s"/><path d="M1150 511 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1150px 520px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.2s"/>
<g transform="translate(130 170)"><circle cx="60" cy="40" r="34" fill="#fff" stroke="#0f1b3d" stroke-width="4"/><path d="M8 150 q0-70 52-70 q52 0 52 70z" fill="#fff" stroke="#0f1b3d" stroke-width="4"/><text x="60" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">Founder</text></g>
<g transform="translate(960 170)"><circle cx="60" cy="40" r="34" fill="#ffd43b" stroke="#0f1b3d" stroke-width="4"/><path d="M8 150 q0-70 52-70 q52 0 52 70z" fill="#ffd43b" stroke="#0f1b3d" stroke-width="4"/><text x="60" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">Freelancer</text></g>
<g transform="translate(340 150)"><rect width="520" height="300" rx="24" fill="#fff" stroke="#0f1b3d" stroke-width="4"/><text x="34" y="52" font-size="24" font-weight="800" fill="#0f1b3d">AD ACCOUNT</text><text x="34" y="82" font-size="16" font-weight="700" fill="#4b5563">6 months of audiences, pixel history and learning</text>
<g style="animation:fadeout 5s ease-in-out infinite"><rect x="50" y="200" width="42" height="50" rx="8" fill="#0b4fd6" stroke="#0f1b3d" stroke-width="3"/><rect x="112" y="170" width="42" height="80" rx="8" fill="#0b4fd6" stroke="#0f1b3d" stroke-width="3"/><rect x="174" y="180" width="42" height="70" rx="8" fill="#0b4fd6" stroke="#0f1b3d" stroke-width="3"/><rect x="236" y="140" width="42" height="110" rx="8" fill="#0b4fd6" stroke="#0f1b3d" stroke-width="3"/><rect x="298" y="155" width="42" height="95" rx="8" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><rect x="360" y="110" width="42" height="140" rx="8" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><rect x="422" y="130" width="42" height="120" rx="8" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/></g>
<g transform="translate(350 -24)"><g style="animation:bob 3s ease-in-out infinite"><rect width="150" height="44" rx="22" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="75" y="30" text-anchor="middle" font-size="20" class="f" fill="#0f1b3d">&#8377;2,40,000</text></g></g></g>
<g transform="translate(250 330)"><g style="animation:slide 4s ease-in-out infinite alternate"><circle cx="30" cy="30" r="22" fill="none" stroke="#ffd43b" stroke-width="10"/><rect x="48" y="25" width="70" height="10" rx="4" fill="#ffd43b"/><rect x="92" y="35" width="10" height="18" rx="3" fill="#ffd43b"/><rect x="108" y="35" width="10" height="12" rx="3" fill="#ffd43b"/></g></g>
<text x="60" y="520" font-size="58" class="f" fill="#fff">One setup mistake.</text><text x="60" y="582" font-size="58" class="f" fill="#ffd43b">Six months of data gone.</text>
</svg>
