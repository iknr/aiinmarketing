<g><rect x="640" y="56" width="470" height="76" rx="18" fill="#fff" stroke="#fff" stroke-width="3"/><circle cx="682" cy="94" r="26" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="682" y="104" text-anchor="middle" class="f" font-size="28" fill="#0f1b3d">R</text><text x="726" y="90" class="f" font-size="26" fill="#0f1b3d">Role</text><text x="726" y="114" font-size="17" font-weight="600" fill="#4a5575">who the AI is</text></g><g><rect x="664" y="146" width="470" height="76" rx="18" fill="#0b4fd6" stroke="#fff" stroke-width="3"/><circle cx="706" cy="184" r="26" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="706" y="194" text-anchor="middle" class="f" font-size="28" fill="#0f1b3d">T</text><text x="750" y="180" class="f" font-size="26" fill="#fff">Task</text><text x="750" y="204" font-size="17" font-weight="600" fill="#d4e2ff">the one job</text></g><g><rect x="640" y="236" width="470" height="76" rx="18" fill="#fff" stroke="#fff" stroke-width="3"/><circle cx="682" cy="274" r="26" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="682" y="284" text-anchor="middle" class="f" font-size="28" fill="#0f1b3d">C</text><text x="726" y="270" class="f" font-size="26" fill="#0f1b3d">Context</text><text x="726" y="294" font-size="17" font-weight="600" fill="#4a5575">what it cannot guess</text></g><g><rect x="664" y="326" width="470" height="76" rx="18" fill="#0b4fd6" stroke="#fff" stroke-width="3"/><circle cx="706" cy="364" r="26" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="706" y="374" text-anchor="middle" class="f" font-size="28" fill="#0f1b3d">R</text><text x="750" y="360" class="f" font-size="26" fill="#fff">Rules</text><text x="750" y="384" font-size="17" font-weight="600" fill="#d4e2ff">do and never do</text></g><g><rect x="640" y="416" width="470" height="76" rx="18" fill="#fff" stroke="#fff" stroke-width="3"/><circle cx="682" cy="454" r="26" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="682" y="464" text-anchor="middle" class="f" font-size="28" fill="#0f1b3d">O</text><text x="726" y="450" class="f" font-size="26" fill="#0f1b3d">Output</text><text x="726" y="474" font-size="17" font-weight="600" fill="#4a5575">the shape of the answer</text></g><g><rect x="664" y="506" width="470" height="76" rx="18" fill="#0b4fd6" stroke="#fff" stroke-width="3"/><circle cx="706" cy="544" r="26" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text x="706" y="554" text-anchor="middle" class="f" font-size="28" fill="#0f1b3d">S</text><text x="750" y="540" class="f" font-size="26" fill="#fff">Style</text><text x="750" y="564" font-size="17" font-weight="600" fill="#d4e2ff">how it should sound</text></g><text x="60" y="440" font-size="58" class="f" fill="#fff">Six boxes.</text><text x="60" y="504" font-size="58" class="f" fill="#ffd43b">Better prompts.</text><text x="60" y="560" font-size="22" font-weight="700" fill="#c9d4f2">The RTCROS prompt framework for marketers</text></svg>
