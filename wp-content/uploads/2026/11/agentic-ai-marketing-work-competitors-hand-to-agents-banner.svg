<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated banner: an AI agent at the centre with ads, SEO, CRM, mail and docs tools orbiting it">
<title>Animated banner: an AI agent at the centre with ads, SEO, CRM, mail and docs tools orbiting it</title>
<style>
text{font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;}
.f{font-weight:800}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-18deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes slide{0%,20%{transform:translateX(0)}45%,100%{transform:translateX(34px)}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.9)}12%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(90px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes climb{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-12px)}}
@keyframes click{0%,55%{transform:translate(0,0) scale(1)}65%{transform:translate(-6px,-6px) scale(.85)}75%,100%{transform:translate(0,0) scale(1)}}
@keyframes fadeout{0%,50%{opacity:1}70%,100%{opacity:.15}}
@keyframes type{from{width:0}to{width:310px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b3d"/><stop offset="1" stop-color="#14286b"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="1060" cy="70" r="230" fill="#0b4fd6" opacity=".35"/><circle cx="90" cy="590" r="170" fill="#ffd43b" opacity=".13"/>
<g transform="translate(48 44)"><rect width="92" height="46" rx="12" fill="#ffd43b" stroke="#fff" stroke-width="3"/><text x="46" y="34" text-anchor="middle" class="f" font-size="30" fill="#0f1b3d">AIM</text></g>
<text x="154" y="62" font-size="15" font-weight="700" fill="#c9d4f2" letter-spacing="1.2">AI IN MARKETING</text>
<text x="154" y="84" font-size="14" font-weight="700" fill="#ffd43b">by Adsmentor</text>

<path d="M150 171 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:150px 180px;animation:twinkle 2.5s ease-in-out infinite;animation-delay:0s"/><path d="M1100 141 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1100px 150px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.6s"/><path d="M1140 511 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1140px 520px;animation:twinkle 2.4s ease-in-out infinite;animation-delay:1.2s"/><path d="M300 411 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:300px 420px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.3s"/>
<g transform="translate(600 300)">
<circle r="165" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="6 10"/>
<g style="animation:spin 18s linear infinite;transform-origin:0 0"><g transform="translate(165 0)"><g style="animation:spin 18s linear infinite reverse;transform-origin:0 0"><circle r="40" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text y="7" text-anchor="middle" font-size="19" class="f" fill="#0f1b3d">Ads</text></g></g><g transform="translate(51 157)"><g style="animation:spin 18s linear infinite reverse;transform-origin:0 0"><circle r="40" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text y="7" text-anchor="middle" font-size="19" class="f" fill="#0f1b3d">SEO</text></g></g><g transform="translate(-133 97)"><g style="animation:spin 18s linear infinite reverse;transform-origin:0 0"><circle r="40" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text y="7" text-anchor="middle" font-size="19" class="f" fill="#0f1b3d">CRM</text></g></g><g transform="translate(-133 -97)"><g style="animation:spin 18s linear infinite reverse;transform-origin:0 0"><circle r="40" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text y="7" text-anchor="middle" font-size="19" class="f" fill="#0f1b3d">Mail</text></g></g><g transform="translate(51 -157)"><g style="animation:spin 18s linear infinite reverse;transform-origin:0 0"><circle r="40" fill="#ffd43b" stroke="#0f1b3d" stroke-width="3"/><text y="7" text-anchor="middle" font-size="19" class="f" fill="#0f1b3d">Docs</text></g></g></g></g>
<g transform="translate(540 225) scale(1.0)"><g style="transform-origin:60px 100px;animation:bob 3.2s ease-in-out infinite">
<line x1="60" y1="14" x2="60" y2="28" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="11" r="6" fill="#ffd43b" stroke="#fff" stroke-width="3" style="transform-origin:60px 11px;animation:pulse 1.6s ease-in-out infinite"/>
<rect x="22" y="28" width="76" height="60" rx="22" fill="#fff" stroke="#0f1b3d" stroke-width="4"/><rect x="31" y="40" width="58" height="34" rx="14" fill="#0f1b3d"/>
<g style="transform-origin:60px 57px;animation:blink 4.5s infinite"><circle cx="48" cy="57" r="6" fill="#ffd43b"/><circle cx="72" cy="57" r="6" fill="#ffd43b"/></g>
<path d="M52 82q8 6 16 0" fill="none" stroke="#0b4fd6" stroke-width="4" stroke-linecap="round"/>
<rect x="38" y="90" width="44" height="22" rx="10" fill="#0b4fd6" stroke="#0f1b3d" stroke-width="4"/><text x="60" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">AIM</text>

<path d="M22 66q-12 4-12 18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g></g>
<g transform="translate(150 330)"><g style="animation:bob2 3.4s ease-in-out infinite"><rect width="250" height="86" rx="22" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><text x="125" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#4b5563">You get back</text><text x="125" y="68" text-anchor="middle" font-size="26" class="f" fill="#0b4fd6">your evenings</text></g></g>
<g transform="translate(890 340)"><g style="animation:bob 3.4s ease-in-out infinite"><rect width="240" height="86" rx="22" fill="#0b4fd6" stroke="#fff" stroke-width="3"/><text x="120" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#c9d4f2">Agent proposes</text><text x="120" y="68" text-anchor="middle" font-size="26" class="f" fill="#fff">You approve</text></g></g>
<text x="60" y="520" font-size="58" class="f" fill="#fff">Let agents do the boring work.</text>
</svg>
