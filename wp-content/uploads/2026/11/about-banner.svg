<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Animated banner: people climbing rising steps, learning made affordable and accessible for all">
<title>Animated banner: people climbing rising steps, learning made affordable and accessible for all</title>
<style>
text{font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;}
.f{font-weight:800}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-18deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes slide{0%,20%{transform:translateX(0)}45%,100%{transform:translateX(34px)}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.9)}12%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(90px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes climb{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-12px)}}
@keyframes click{0%,55%{transform:translate(0,0) scale(1)}65%{transform:translate(-6px,-6px) scale(.85)}75%,100%{transform:translate(0,0) scale(1)}}
@keyframes fadeout{0%,50%{opacity:1}70%,100%{opacity:.15}}
@keyframes type{from{width:0}to{width:310px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b3d"/><stop offset="1" stop-color="#14286b"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="1060" cy="70" r="230" fill="#0b4fd6" opacity=".35"/><circle cx="90" cy="590" r="170" fill="#ffd43b" opacity=".13"/>
<g transform="translate(48 44)"><rect width="92" height="46" rx="12" fill="#ffd43b" stroke="#fff" stroke-width="3"/><text x="46" y="34" text-anchor="middle" class="f" font-size="30" fill="#0f1b3d">AIM</text></g>
<text x="154" y="62" font-size="15" font-weight="700" fill="#c9d4f2" letter-spacing="1.2">AI IN MARKETING</text>
<text x="154" y="84" font-size="14" font-weight="700" fill="#ffd43b">by Adsmentor</text>

<path d="M150 161 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:150px 170px;animation:twinkle 2.5s ease-in-out infinite;animation-delay:0s"/><path d="M430 121 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:430px 130px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.6s"/><path d="M1120 181 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1120px 190px;animation:twinkle 2.2s ease-in-out infinite;animation-delay:1.1s"/><path d="M1130 511 l2.6 6 6.4.5-4.9 4.2 1.5 6.3-5.6-3.4-5.6 3.4 1.5-6.3-4.9-4.2 6.4-.5z" fill="#ffd43b" style="transform-origin:1130px 520px;animation:twinkle 3s ease-in-out infinite;animation-delay:0.4s"/>
<circle cx="980" cy="190" r="70" fill="#ffd43b" style="transform-origin:980px 190px;animation:pulse 3s ease-in-out infinite"/>
<rect x="120" y="370" width="130" height="70" rx="12" fill="#0b4fd6" stroke="#fff" stroke-width="4"/><rect x="270" y="315" width="130" height="125" rx="12" fill="#0b4fd6" stroke="#fff" stroke-width="4"/><rect x="420" y="260" width="130" height="180" rx="12" fill="#0b4fd6" stroke="#fff" stroke-width="4"/><rect x="570" y="205" width="130" height="235" rx="12" fill="#0b4fd6" stroke="#fff" stroke-width="4"/><rect x="720" y="150" width="130" height="290" rx="12" fill="#ffd43b" stroke="#fff" stroke-width="4"/><g transform="translate(185 318)"><g style="animation:climb 2.4s ease-in-out infinite;animation-delay:0.0s"><circle cx="0" cy="-14" r="14" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><path d="M-18 40 q0-34 18-34 q18 0 18 34z" fill="#fff" stroke="#0f1b3d" stroke-width="3"/></g></g><g transform="translate(335 263)"><g style="animation:climb 2.4s ease-in-out infinite;animation-delay:0.25s"><circle cx="0" cy="-14" r="14" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><path d="M-18 40 q0-34 18-34 q18 0 18 34z" fill="#fff" stroke="#0f1b3d" stroke-width="3"/></g></g><g transform="translate(485 208)"><g style="animation:climb 2.4s ease-in-out infinite;animation-delay:0.5s"><circle cx="0" cy="-14" r="14" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><path d="M-18 40 q0-34 18-34 q18 0 18 34z" fill="#fff" stroke="#0f1b3d" stroke-width="3"/></g></g><g transform="translate(635 153)"><g style="animation:climb 2.4s ease-in-out infinite;animation-delay:0.75s"><circle cx="0" cy="-14" r="14" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><path d="M-18 40 q0-34 18-34 q18 0 18 34z" fill="#fff" stroke="#0f1b3d" stroke-width="3"/></g></g><g transform="translate(785 98)"><g style="animation:climb 2.4s ease-in-out infinite;animation-delay:1.0s"><circle cx="0" cy="-14" r="14" fill="#fff" stroke="#0f1b3d" stroke-width="3"/><path d="M-18 40 q0-34 18-34 q18 0 18 34z" fill="#fff" stroke="#0f1b3d" stroke-width="3"/></g></g>
<g transform="translate(790 300)"><g style="animation:bob2 3.2s ease-in-out infinite"><rect width="300" height="150" rx="22" fill="#fff" stroke="#0f1b3d" stroke-width="4"/><text x="150" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#4b5563">All-inclusive fee</text><text x="150" y="112" text-anchor="middle" font-size="56" class="f" fill="#0b4fd6">&#8377;5,999</text></g></g>
<text x="60" y="520" font-size="58" class="f" fill="#fff">Real marketing learning,</text><text x="60" y="582" font-size="58" class="f" fill="#ffd43b">for everyone.</text>
</svg>
